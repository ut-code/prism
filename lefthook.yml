pre-commit:
  parallel: true
  jobs:
    - name: Type Check
      run: bun run --filter=* check
    - name: Run codegen before commit
      run: bun run sync
      stage_fixed: true
    - name: Prettier
      run: bun run fix:format
      stage_fixed: true
    - name: Biome Lint
      run: bun run check:lint
